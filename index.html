<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Practice Test Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
      <h1>AI Practice Test Generator</h1>
      <p>Create practice tests, flashcards, and study PDFs instantly using AI.</p>
    </div>
  </header>

  <main>

    <section class="generator-panel">
      <h2>Generator Settings</h2>

      <div class="grid">

        <div class="card">
          <label>Question Type</label>
          <select id="questionType">
            <option>Multiple Choice</option>
            <option>True / False</option>
            <option>Short Answer</option>
            <option>Fill in the Blank</option>
            <option>Essay</option>
            <option>Mixed</option>
          </select>
        </div>

        <div class="card">
          <label>Difficulty</label>
          <select id="difficulty">
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
          </select>
        </div>

        <div class="card">
          <label>Number of Questions</label>
          <input type="number" id="questionCount" value="10" min="1" max="100" />
        </div>

      </div>

      <div class="notes-section">
        <label>Paste Study Notes</label>
        <textarea id="notesInput" placeholder="Paste notes here..."></textarea>
      </div>

      <div class="button-row">
        <button id="generateBtn">Generate Questions</button>
        <button id="flashcardBtn">Generate Flashcards</button>
        <button id="pdfBtn">Export PDF</button>
      </div>
    </section>

    <section class="output-section">
      <div class="section-header">
        <h2>Generated Content</h2>
        <span id="status">Ready</span>
      </div>

      <div id="output"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
